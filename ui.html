<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent 工作台</title>
<style>
:root{--bg:#0F1116;--sf:#171A21;--sf2:#1E222B;--ink:#E6E9EF;--ink2:#A8AEBB;--ink3:#6E7686;
 --rule:#282D38;--run:#4C8DFF;--stall:#E0A030;--ok:#3FB98C;--fail:#E06C5C;--kill:#8B7BD8;
 --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
 --sans:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding:1.6rem 1.2rem 4rem}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;
 border-bottom:1px solid var(--rule);padding-bottom:1rem;margin-bottom:1.3rem}
h1{margin:0;font-size:1.32rem;letter-spacing:-.01em}
.sub{color:var(--ink3);font-size:.8rem;font-family:var(--mono);margin-top:.35rem}
button{font-family:var(--mono);font-size:.76rem;background:var(--sf2);color:var(--ink2);
 border:1px solid var(--rule);border-radius:3px;padding:.42rem .8rem;cursor:pointer}
button:hover{border-color:var(--run);color:var(--ink)}
button.pri{background:var(--run);border-color:var(--run);color:#fff}
/* 汇总 */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));gap:1px;background:var(--rule);
 border:1px solid var(--rule);margin-bottom:1.3rem}
.sum div{background:var(--sf);padding:.7rem .8rem}
.sum b{display:block;font-family:var(--mono);font-size:1.3rem;font-variant-numeric:tabular-nums;line-height:1.2}
.sum span{font-size:.72rem;color:var(--ink3)}
/* 网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.card{background:var(--sf);border:1px solid var(--rule);border-left:3px solid var(--ink3);
 padding:.6rem .7rem;cursor:pointer;position:relative;transition:border-color .12s}
.card:hover{border-color:var(--ink3)}
.card.running{border-left-color:var(--run)}
.card.stalled{border-left-color:var(--stall);background:linear-gradient(90deg,rgba(224,160,48,.09),transparent)}
.card.done{border-left-color:var(--ok);opacity:.72}
.card.failed{border-left-color:var(--fail)}
.card.killed{border-left-color:var(--kill);opacity:.6}
.card.sel{border-color:var(--run)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:.4rem}
.card .id{font-family:var(--mono);font-size:.82rem;font-weight:600}
.card .st{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase}
.running .st{color:var(--run)}.stalled .st{color:var(--stall)}.done .st{color:var(--ok)}
.failed .st{color:var(--fail)}.killed .st{color:var(--kill)}.pending .st{color:var(--ink3)}
.card .dt{font-size:.7rem;color:var(--ink3);margin-top:.35rem;line-height:1.45;height:2.6em;overflow:hidden}
.card .el{font-family:var(--mono);font-size:.68rem;color:var(--ink3);margin-top:.35rem;font-variant-numeric:tabular-nums}
.pulse{position:absolute;top:.6rem;right:.6rem;width:6px;height:6px;border-radius:50%;background:var(--run)}
@media (prefers-reduced-motion:no-preference){.running .pulse{animation:p 1.4s ease-in-out infinite}}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
/* 抽屉 */
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(480px,92vw);background:var(--sf);
 border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .18s;
 display:flex;flex-direction:column;z-index:9}
.drawer.open{transform:none}
.dh{padding:1rem 1.1rem;border-bottom:1px solid var(--rule)}
.dh h2{margin:0 0 .3rem;font-size:1rem;font-family:var(--mono)}
.acts{display:flex;gap:.45rem;margin-top:.75rem}
.dl{flex:1;overflow:auto;padding:.6rem 1.1rem 2rem;font-family:var(--mono);font-size:.72rem;line-height:1.7}
.dl .ev{border-bottom:1px dotted var(--rule);padding:.3rem 0;display:flex;gap:.6rem}
.dl .k{color:var(--ink3);flex:none;width:4.2rem}
.dl .k.stalled{color:var(--stall)}.dl .k.end{color:var(--ok)}.dl .k.killed{color:var(--kill)}
.note{color:var(--ink3);font-size:.78rem;line-height:1.7;margin-top:1.4rem;
 border-top:1px solid var(--rule);padding-top:1rem}
.note b{color:var(--ink2)}
</style></head><body>
<div class="wrap">
<header>
  <div><h1>Agent 工作台</h1>
    <div class="sub" id="meta">尚未开始</div></div>
  <div style="display:flex;gap:.5rem">
    <button class="pri" onclick="launch()">开始一次运行</button>
    <button onclick="load()">刷新</button>
  </div>
</header>
<div class="sum" id="sum"></div>
<div class="grid" id="grid"></div>
<div class="note">
  <b>这个界面在解决什么：</b>并行跑十几个 agent 时，日志会互相刷屏，人看不出谁在做什么、谁卡住了。
  所以这里不显示日志流，显示<b>状态</b>——每个 agent 一格，颜色即状态；超过 8 秒没有新输出会被标为
  <b style="color:var(--stall)">卡住</b>，而不是等它超时；点开任意一格可以<b>只中止或只重试这一个</b>，其余不受影响；
  每一格都保留完整时间线，事后能回看它在哪一步出的问题。
</div>
</div>

<div class="drawer" id="drawer">
  <div class="dh">
    <h2 id="dTitle">—</h2>
    <div class="sub" id="dSub"></div>
    <div class="acts">
      <button onclick="act('kill')">中止这一个</button>
      <button onclick="act('retry')">重试这一个</button>
      <button onclick="closeD()" style="margin-left:auto">关闭</button>
    </div>
  </div>
  <div class="dl" id="dLog"></div>
</div>

<script>
let S={run:null,agents:[]}, sel=null;
const j=async u=>(await fetch(u)).json();
const secs=(a,b)=>!a?'—':((b||Date.now()/1000)-a).toFixed(1)+'s';
const ST={pending:'排队',running:'运行中',stalled:'卡住',done:'完成',failed:'失败',killed:'已中止'};

async function load(){
  S=await j('/api/state'); render();
  if(sel) drawer(sel);
}
async function launch(){ await j('/api/launch?n=24&p=6'); setTimeout(load,600); }
async function act(a){ if(!sel)return; await j(`/api/act?run=${S.run.run_id}&agent=${sel}&do=${a}`); setTimeout(load,400); }

function render(){
  const m=document.getElementById('meta');
  if(!S.run){m.textContent='尚未开始';return;}
  m.textContent=`${S.run.task} · ${S.run.run_id}`;
  const c={};(S.agents||[]).forEach(a=>c[a.state]=(c[a.state]||0)+1);
  const done=(c.done||0), tot=S.agents.length;
  document.getElementById('sum').innerHTML=
    [['运行中',c.running||0],['卡住',c.stalled||0],['完成',done],['失败',c.failed||0],
     ['已中止',c.killed||0],['进度',tot?Math.round(done/tot*100)+'%':'—']]
    .map(([k,v])=>`<div><b>${v}</b><span>${k}</span></div>`).join('');
  document.getElementById('grid').innerHTML=(S.agents||[]).map(a=>`
    <div class="card ${a.state} ${sel===a.agent_id?'sel':''}" onclick="drawer('${a.agent_id}')">
      ${a.state==='running'?'<div class="pulse"></div>':''}
      <div class="top"><span class="id">${a.label}</span><span class="st">${ST[a.state]||a.state}</span></div>
      <div class="dt">${(a.detail||'').replace(/</g,'&lt;').slice(0,90)}</div>
      <div class="el">${secs(a.started,a.finished)}</div>
    </div>`).join('');
}
async function drawer(id){
  sel=id; const a=(S.agents||[]).find(x=>x.agent_id===id); if(!a)return;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('dTitle').textContent=a.label+' · '+(ST[a.state]||a.state);
  document.getElementById('dSub').textContent=`用时 ${secs(a.started,a.finished)}｜退出码 ${a.exit_code??'—'}`;
  const ev=await j(`/api/timeline?run=${S.run.run_id}&agent=${id}`);
  document.getElementById('dLog').innerHTML=ev.map(e=>{
    const p=JSON.parse(e.payload||'{}');
    const txt=p.line??p.spec??JSON.stringify(p);
    return `<div class="ev"><span class="k ${e.kind}">${e.kind}</span><span>${String(txt).replace(/</g,'&lt;')}</span></div>`;
  }).join('')||'<div style="color:var(--ink3)">暂无事件</div>';
  render();
}
function closeD(){sel=null;document.getElementById('drawer').classList.remove('open');render();}
load(); setInterval(load,1200);
</script></body></html>
